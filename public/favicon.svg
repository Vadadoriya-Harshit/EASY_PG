<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="luxora-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5D061"/>
      <stop offset="50%" stopColor="#C5A059"/>
      <stop offset="100%" stopColor="#997028"/>
    </linearGradient>
    <linearGradient id="luxora-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0F19"/>
      <stop offset="100%" stopColor="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#C5A059" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Premium Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#luxora-bg)" stroke="#C5A059" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Serif Letter 'L' (Crisp Platinum / White) -->
  <path d="M 20 18 L 28 18 L 28 21 L 25.5 21 L 25.5 42 L 34 42 L 35 39 L 37.5 39 L 36.5 45 L 20 45 L 20 42 L 22.5 42 L 22.5 21 L 20 21 Z" fill="#F8FAFC" filter="url(#glow)"/>

  <!-- Interlocking Serif Letter 'G' (Lustrous Gold) -->
  <path d="M 43 25 C 41.5 20.5 37.5 19 33 19.5 C 29.5 20 28 22 27.5 23.5 L 30 25 C 31 23 32.5 22 34.5 22 C 38 22 40 24.5 40 28.5 C 40 33.5 37.5 37 33.5 37 C 31 37 29.5 35.5 29.5 33 L 34 33 L 34 30.5 L 26.5 30.5 L 26.5 33.5 C 26.5 38 29.5 40.5 34.5 40.5 C 40 40.5 44 36.5 44 30 C 44 28 43.6 26.3 43 25 Z" fill="url(#luxora-gold)" filter="url(#glow)"/>

  <!-- Architectural House Roof Peak Over Emblem -->
  <path d="M 32 23 L 42 32 L 39.5 33.5 L 32 26.5 L 24.5 33.5 L 22 32 Z" fill="#F8FAFC" opacity="0.95"/>

  <!-- 4-Paned Window Grid -->
  <rect x="30" y="28.5" width="1.6" height="1.6" rx="0.3" fill="url(#luxora-gold)"/>
  <rect x="32.4" y="28.5" width="1.6" height="1.6" rx="0.3" fill="url(#luxora-gold)"/>
  <rect x="30" y="30.9" width="1.6" height="1.6" rx="0.3" fill="url(#luxora-gold)"/>
  <rect x="32.4" y="30.9" width="1.6" height="1.6" rx="0.3" fill="url(#luxora-gold)"/>
</svg>
